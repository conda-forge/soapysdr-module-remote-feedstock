schema_version: 1

context:
  name: soapysdr-module-remote
  version: "0.5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/pothosware/SoapyRemote/archive/soapy-remote-${{ version }}.tar.gz
  sha256: de5bdf209dc93bf7c341077e1e21353037fc387e7c6a9ee41eace3390669dcc1

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - soapysdr
  run_exports:
    - ${{ pin_subpackage("soapysdr-module-remote", upper_bound="x.x") }}

tests:
  - package_contents:
      strict: true
      files:
        - if: not win
          then: lib/SoapySDR/modules${{ soapysdr }}/libremoteSupport.so
          else: Library/lib/SoapySDR/modules${{ soapysdr }}/remoteSupport.dll
  - script:
      - SoapySDRUtil --info
      - SoapySDRServer --help
      - if: not win
        then: SoapySDRUtil --info | grep remoteSupport
        else: SoapySDRUtil --info | findstr /l remoteSupport

about:
  license: BSL-1.0
  license_file: LICENSE_1_0.txt
  summary: SoapySDR remote module, use any Soapy SDR remotely
  description: |
    Use any SoapySDR supported device transparently over a local network link.
    The remote support feature can turn any SDR into a network peripheral.
  homepage: https://github.com/pothosware/SoapyRemote/wiki
  repository: https://github.com/pothosware/SoapyRemote
  documentation: https://github.com/pothosware/SoapyRemote/wiki

extra:
  recipe-maintainers:
    - petrushy
    - ryanvolz
