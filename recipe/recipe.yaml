schema_version: 1

context:
  name: soapysdr-module-remote
  version: "0.5.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/pothosware/SoapyRemote/archive/soapy-remote-${{ version }}.tar.gz
  sha256: 7109077f9f64c530c26604d2f30437d4403d6133df50e600c3c7e022a622521c

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - soapysdr
  run_exports:
    - ${{ pin_subpackage("soapysdr-module-remote", upper_bound="x.x") }}

tests:
  - package_contents:
      strict: true
      bin:
        - SoapySDRServer
      files:
        - if: not win
          then:
            - lib/SoapySDR/modules${{ soapysdr }}/libremoteSupport.so
            - share/man/man1/SoapySDRServer.1
          else:
            - Library/lib/SoapySDR/modules${{ soapysdr }}/remoteSupport.dll
            - Library/share/man/man1/SoapySDRServer.1
        - if: linux
          then:
            - lib/sysctl.d/10-SoapySDRServer.conf
            - lib/systemd/system/SoapySDRServer.service
  - script:
      - SoapySDRUtil --info
      - SoapySDRServer --help
      - if: not win
        then: SoapySDRUtil --info | grep remoteSupport
        else: SoapySDRUtil --info | findstr /l remoteSupport

about:
  license: BSL-1.0
  license_file: LICENSE_1_0.txt
  summary: SoapySDR remote module, use any Soapy SDR remotely
  description: |
    Use any SoapySDR supported device transparently over a local network link.
    The remote support feature can turn any SDR into a network peripheral.
  homepage: https://github.com/pothosware/SoapyRemote/wiki
  repository: https://github.com/pothosware/SoapyRemote
  documentation: https://github.com/pothosware/SoapyRemote/wiki

extra:
  recipe-maintainers:
    - petrushy
    - ryanvolz
